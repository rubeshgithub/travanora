services:
  # ── API (Node.js web service) ──────────────────────────────────────────────
  - type: web
    name: travanora-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @travanora/shared build && pnpm --filter api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: JWT_REFRESH_TTL_REMEMBER_ME
        value: 30d
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: DUFFEL_LIVE
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SES_FROM_EMAIL
        sync: false
      - key: SES_REPLY_TO
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ── Web (Vite SPA — static site) ──────────────────────────────────────────
  - type: web
    name: travanora-web
    runtime: static
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @travanora/shared build && pnpm --filter web build
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
